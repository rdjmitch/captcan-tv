name: Build Fire TV app
on:
  push:
    branches: [main]
    paths: ['tools/firetv-app/**', '.github/workflows/firetv-app.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Build APK
        run: bash tools/firetv-app/build.sh
      - name: Commit APK
        run: |
          git config user.name "captcan-tv-build"
          git config user.email "actions@users.noreply.github.com"
          git add app/captcan-tv.apk
          git diff --cached --quiet || git commit -m "Fire TV app build $(cat tools/firetv-app/VERSION)"
          git pull --rebase origin main
          git push origin HEAD:main
