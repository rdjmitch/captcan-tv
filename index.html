<!doctype html><html lang="en"><head><meta charset="utf-8"><title>CaptCan TV</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@700;800;900&family=Roboto:wght@400;500;700;900&display=swap">
<style>
/* CaptCan TV v5. Site language (Work Sans 900 heads with one red phrase, Roboto tracked labels with a red square, square red buttons). Flat colour only: no gradients (they band on TVs), no blur, no big shadows, so it stays sharp and smooth. Stage is 1920x1080, scaled with zoom so text renders crisp. */
:root{--ink:#121212;--panel:#1C1C1F;--panel2:#26262A;--line:#2E2E33;--white:#fff;--red:#EB1C24;--btn:#E01A22;--mute:#A9A9B0;--gold:#FFC21A;
  --head:'Work Sans','Helvetica Neue',Arial,sans-serif;--body:Roboto,'Helvetica Neue',Arial,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden;cursor:none}html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{display:flex;align-items:center;justify-content:center}
#stage{position:absolute;left:50%;top:50%;transform-origin:50% 50%;width:1920px;height:1080px;flex:none;background:var(--ink);color:var(--white);font-family:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
.scene{position:absolute;left:0;top:0;width:1920px;height:984px;overflow:hidden;background:var(--ink)}
.H{font-family:var(--head);font-weight:900;text-transform:uppercase;letter-spacing:.01em;line-height:.95;margin:0}
.H em{font-style:normal;color:var(--red)}
.eye{display:flex;align-items:center;gap:16px;font-weight:700;font-size:26px;letter-spacing:.2em;text-transform:uppercase;margin:0;color:#fff}
.eye::before{content:"";width:16px;height:16px;background:var(--red);flex:none}
.btn{display:inline-flex;align-items:center;gap:18px;white-space:nowrap;background:var(--btn);color:#fff;font-weight:900;font-size:28px;letter-spacing:.14em;text-transform:uppercase;padding:20px 32px}
.btn::after{content:"\2192";letter-spacing:0}
.pill{display:inline-block;background:var(--btn);font-weight:900;font-size:22px;letter-spacing:.12em;text-transform:uppercase;padding:9px 16px}
.in{animation:in .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes in{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.d1{animation-delay:.08s}.d2{animation-delay:.16s}.d3{animation-delay:.24s}.d4{animation-delay:.32s}
.corner-red{position:absolute;right:0;top:0;width:14px;height:100%;background:var(--red)}

/* transition */
#cut{position:absolute;top:0;right:0;bottom:0;left:0;z-index:40;pointer-events:none;background:var(--red);transform:translateX(-100%)}
#cut.go{animation:cut .6s cubic-bezier(.7,0,.3,1) both}
@keyframes cut{0%{transform:translateX(-100%)}48%,52%{transform:translateX(0)}100%{transform:translateX(100%)}}

/* chrome */
#bug{position:absolute;right:44px;top:40px;z-index:35;transition:opacity .4s}
#bug img{width:104px;height:104px;display:block}
body.clean #bug,body.cinema #bug{opacity:0}
#bar{position:absolute;left:0;right:0;bottom:0;height:96px;display:flex;z-index:34;background:#0B0B0C;border-top:3px solid #2A2A2F;transition:transform .5s}
#prog{position:absolute;left:0;right:0;top:-3px;height:3px;background:var(--red);transform-origin:left;transform:scaleX(0)}
#pz{display:none;align-items:center;padding:0 22px;background:var(--btn);font-weight:900;font-size:22px;letter-spacing:.16em;text-transform:uppercase}
body.paused #pz{display:flex}
body.cinema #bar,body.clean #bar{transform:translateY(105%)}
#bar .lab{display:flex;align-items:center;justify-content:center;width:250px;padding:0 22px;background:#0B0B0C;border-right:1px solid var(--line)}
#bar .lab img{height:78px;width:auto;display:block}
#bar .track{flex:1;overflow:hidden;display:flex;align-items:center}
#bar .run{display:flex;white-space:nowrap;font-weight:700;font-size:30px;letter-spacing:.06em;text-transform:uppercase;will-change:transform}
#bar .run span{display:flex;align-items:center;gap:40px;padding-right:40px}
#bar .run span::after{content:"";width:10px;height:10px;background:var(--red)}
#bar .clock{width:200px;display:flex;align-items:center;justify-content:center;font-family:var(--head);font-weight:800;font-size:40px;border-left:1px solid var(--line)}
/* QR chip used on product scenes */
.qrc{display:inline-flex;align-items:center;gap:20px;background:#fff;color:var(--ink);padding:12px 26px 12px 12px}
.qrc img{width:136px;height:136px;display:block;image-rendering:pixelated}
.qrc b{display:block;font-family:var(--head);font-weight:900;font-size:34px;text-transform:uppercase;line-height:1}
.qrc span{display:block;font-weight:700;font-size:19px;letter-spacing:.08em;text-transform:uppercase;color:#555;margin-top:8px}

/* open */
.open .photo{position:absolute;top:0;right:0;bottom:0;left:0;background-size:cover;background-position:center;animation:fade 1.2s ease both}
.open .veil{position:absolute;top:0;right:0;bottom:0;left:0;background:rgba(14,14,15,.74)}
.open .copy{position:absolute;left:130px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:30px}
.open img.logo{width:780px;display:block}
.open h1{font-size:104px}

/* board: two columns, ranked down the left then the right */
.board{padding:52px 110px 0}
.board header,.keys header,.merch header,.mk header{padding-right:150px}
.board header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:30px}
.board h1{font-size:108px}
.board .note{font-weight:700;font-size:22px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);text-align:right;line-height:1.5}
.rows{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(4,160px);grid-auto-flow:column;gap:14px 36px}
.r{display:grid;grid-template-columns:76px 100px minmax(0,1fr) auto;align-items:center;gap:24px;background:var(--panel);padding-right:30px;border-left:6px solid var(--line);opacity:0;animation:in .5s ease both}
.r.top{border-left-color:var(--red)}
.r .n{font-family:var(--head);font-weight:900;font-size:54px;text-align:center;color:var(--mute)}
.r.top .n{color:#fff}
.r img{width:100px;height:150px;object-fit:cover;display:block}
.r b{font-family:var(--head);font-weight:800;font-size:34px;text-transform:uppercase;line-height:1.05;min-width:0}
.r b small{display:block;font-family:var(--body);font-weight:700;font-size:19px;letter-spacing:.06em;color:var(--mute);margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r .p{font-family:var(--head);font-weight:900;font-size:44px}

/* product hero */
.hero .copy{position:absolute;left:130px;top:96px;bottom:96px;width:900px;display:flex;flex-direction:column;justify-content:center;gap:30px}
.hero h1{font-size:104px;text-wrap:balance}
.hero .sub{font-family:var(--head);font-weight:800;font-size:38px;text-transform:uppercase;color:#cfcfd4;line-height:1.1}
.hero .row{display:flex;align-items:center;gap:40px;margin-top:10px}
.hero .price{font-family:var(--head);font-weight:900;font-size:120px;line-height:1}
.hero .frame{position:absolute;right:180px;top:74px;width:574px;height:860px;background:#000;animation:fade .8s ease both}
.hero .frame img{width:100%;height:100%;object-fit:cover;display:block}
.hero .frame .pill{position:absolute;left:0;top:26px}

/* coming soon */
.soon .grid{position:absolute;right:180px;top:74px;bottom:74px;display:flex;gap:24px;align-items:center}
.soon .grid img{height:760px;width:506px;object-fit:cover;display:block;animation:fade .8s ease both}
.soon .copy{position:absolute;left:130px;top:96px;bottom:96px;width:880px;display:flex;flex-direction:column;justify-content:center;gap:28px}
.soon h1{font-size:96px;text-wrap:balance}
.soon .stat{font-family:var(--head);font-weight:900;font-size:44px;text-transform:uppercase}
.soon .stat em{font-style:normal;color:var(--red)}

/* quiz */
.quiz{display:grid;grid-template-columns:540px minmax(0,1fr);gap:110px;align-items:center;padding:0 150px}
.quiz .cover{width:540px;height:810px;object-fit:cover;display:block;animation:fade .7s ease both}
.quiz .q{display:flex;flex-direction:column;gap:26px;min-width:0}
.quiz .q h1{font-size:92px;text-wrap:balance}
.quiz .q .book{font-family:var(--head);font-weight:800;font-size:36px;text-transform:uppercase;color:#cfcfd4;line-height:1.1}
.quiz .timer{height:10px;background:var(--line);width:100%;margin:6px 0 10px}
.quiz .timer i{display:block;height:100%;width:0;background:var(--red);animation:bar 6.5s linear both}
@keyframes bar{to{width:100%}}
.quiz .a{display:flex;flex-direction:column;gap:18px;opacity:0;animation:in .6s ease both 6.8s}
.quiz .a h2{font-family:var(--head);font-weight:900;font-size:112px;text-transform:uppercase;line-height:.95;margin:0;color:var(--red);text-wrap:balance}
.quiz .a p.t{font-size:32px;color:#ddd;margin:0;line-height:1.35}
/* story (key issue) */
.story .copy{position:absolute;left:130px;top:96px;bottom:96px;width:900px;display:flex;flex-direction:column;justify-content:center;gap:28px}
.story h1{font-size:128px;text-wrap:balance}
.story .book{font-family:var(--head);font-weight:800;font-size:38px;text-transform:uppercase;color:#cfcfd4}
.story .row{display:flex;align-items:center;gap:40px}
.story .price{font-family:var(--head);font-weight:900;font-size:110px;line-height:1}
.story .slab{position:absolute;right:180px;top:60px;width:592px;height:888px;background:#000;animation:fade .8s ease both}
.story .slab img{width:100%;height:100%;object-fit:cover;display:block}

/* value */
.value{display:grid;grid-template-columns:840px 1fr;align-items:center;gap:80px;padding:0 140px 0 130px}
.value .copy{display:flex;flex-direction:column;gap:30px}
.value h1{font-size:112px}
.value .txt{font-size:40px;line-height:1.32;color:#ddd;margin:0}
.value .imgs{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.value .imgs img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;animation:fade .7s ease both}

/* school */
.school{display:flex;flex-direction:column;justify-content:center;gap:38px;padding:0 130px}
.school h1{font-size:112px}
.school .lead{font-size:36px;color:#ddd;margin:0;line-height:1.3;max-width:1500px}
.scale{display:grid;grid-template-columns:repeat(10,1fr);gap:10px}
.scale div{background:var(--panel);padding:22px 8px 18px;text-align:center}
.scale div.hl{background:var(--btn)}
.scale b{display:block;font-family:var(--head);font-weight:900;font-size:56px}
.scale span{display:block;font-weight:700;font-size:19px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin-top:6px}
.scale div.hl span{color:#fff}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.facts div{background:var(--panel);border-top:6px solid var(--red);padding:24px 28px}
.facts b{display:block;font-family:var(--head);font-weight:900;font-size:38px;text-transform:uppercase;line-height:1}
.facts span{display:block;font-size:27px;color:#ccc;margin-top:12px;line-height:1.32}

/* keys grid */
.keys{padding:56px 110px 0}
.keys header,.merch header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:34px}
.keys h1,.merch h1{font-size:108px}
.slabs{display:grid;grid-template-columns:repeat(6,1fr);gap:22px}
.slab6{background:var(--panel)}
.slab6 img{width:100%;height:440px;object-fit:cover;display:block}
.slab6 div{padding:16px 18px 20px}
.slab6 b{display:block;font-family:var(--head);font-weight:800;font-size:23px;text-transform:uppercase;line-height:1.1;height:52px;overflow:hidden}
.slab6 span{display:block;font-family:var(--head);font-weight:900;font-size:44px;margin-top:10px}

/* presale */
.presale{display:grid;grid-template-columns:1fr 860px;align-items:center;gap:60px;padding:0 120px 0 130px}
.presale .copy{display:flex;flex-direction:column;gap:30px}
.presale h1{font-size:112px}
.count{display:flex;gap:14px}
.count div{background:var(--panel);border-top:6px solid var(--red);padding:18px 0 14px;width:166px;text-align:center}
.count b{display:block;font-family:var(--head);font-weight:900;font-size:92px;line-height:1;font-variant-numeric:tabular-nums}
.count s{text-decoration:none;font-weight:700;font-size:19px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
.covers{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.covers img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;animation:fade .7s ease both}

/* merch */
.merch{padding:56px 110px 0}
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px}
.m{background:#fff;color:var(--ink)}
.m img{width:100%;height:560px;object-fit:cover;display:block}
.m div{padding:18px 20px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.m b{font-family:var(--head);font-weight:800;font-size:24px;text-transform:uppercase;line-height:1.1}
.m span{font-family:var(--head);font-weight:900;font-size:36px;white-space:nowrap}

/* how-to */
.howto{display:grid;grid-template-columns:1fr 560px;align-items:center;padding:0 150px 0 130px;gap:60px}
.howto .copy{display:flex;flex-direction:column;gap:28px}
.howto h1{font-size:108px}
.steps{display:flex;flex-direction:column;gap:12px;margin-top:6px}
.st{display:grid;grid-template-columns:72px 1fr;align-items:center;gap:20px;background:var(--panel);padding:16px 26px 16px 0;font-size:34px;font-weight:700;color:#7A7A80;transition:color .3s,background .3s}
.st i{font-style:normal;font-family:var(--head);font-weight:900;font-size:38px;text-align:center}
.st.on{color:#fff;background:var(--panel2)}.st.on i{color:var(--red)}
.phone{justify-self:end;width:420px;height:850px;border-radius:58px;background:#000;border:3px solid #2E2E33;position:relative}
.screen{position:absolute;inset:14px;border-radius:44px;overflow:hidden;background:#fff;color:#121212}
.scr{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;opacity:0;transition:opacity .3s}.scr.on{opacity:1}
.ph-top{background:#121212;padding:52px 18px 14px;display:flex;flex-direction:column;gap:12px}
.ph-top .rw{display:flex;justify-content:space-between;align-items:center}
.ph-top img{width:160px;display:block}.ph-top .ic{color:#fff;font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.ph-search{display:flex;height:40px}.ph-search span{flex:1;background:#fff;color:#888;font-size:15px;display:flex;align-items:center;padding:0 12px}.ph-search b{width:44px;background:var(--btn)}
.ph-nav{background:#121212;border-top:1px solid #2E2E33;display:flex;gap:14px;padding:10px 18px;color:#fff;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.ph-body{flex:1;padding:20px;display:flex;flex-direction:column;gap:14px;font-size:18px}
.ph-h{font-family:var(--head);font-weight:900;font-size:26px;text-transform:uppercase;line-height:1.05}
.ph-in{border:1px solid #bbb;padding:14px;font-size:18px;color:#444;min-height:52px}
.ph-btn{background:var(--btn);color:#fff;padding:16px;text-align:center;font-weight:900;font-size:17px;letter-spacing:.12em;text-transform:uppercase}
.ph-btn.dk{background:#121212}
.ph-mute{color:#666;font-size:15px;line-height:1.35}
.ph-cover{width:100%;height:300px;object-fit:cover;display:block;background:#eee}
.ph-code{display:flex;gap:8px}.ph-code b{flex:1;height:58px;border:1px solid #bbb;display:flex;align-items:center;justify-content:center;font-size:28px}
.ph-opt{border:1px solid #ccc;padding:14px;display:flex;align-items:center;gap:12px;font-weight:700}
.ph-opt.sel{border:2px solid var(--btn)}
.ph-opt i{width:20px;height:20px;border-radius:50%;border:2px solid #aaa;flex:none}.ph-opt.sel i{border:6px solid var(--btn)}
.ph-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.ph-grid img{width:100%;height:150px;object-fit:cover;display:block;background:#eee}
.ph-chip{display:inline-block;border:1px solid #ccc;padding:7px 12px;font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;margin:0 6px 6px 0}.ph-chip.sel{background:#121212;color:#fff;border-color:#121212}
.tap{position:absolute;width:66px;height:66px;margin:-33px 0 0 -33px;border-radius:50%;border:4px solid var(--btn);background:rgba(224,26,34,.22);z-index:6;opacity:0;pointer-events:none}
.tap.go{animation:tap .9s ease}
@keyframes tap{0%{opacity:0;transform:scale(1.7)}30%{opacity:1;transform:scale(.85)}100%{opacity:0;transform:scale(1.3)}}

/* event */
.event .photo{position:absolute;top:0;right:0;bottom:0;left:0;background-size:cover;background-position:center}
.event .veil{position:absolute;top:0;right:0;bottom:0;left:0;background:rgba(14,14,15,.8)}
.event .copy{position:absolute;left:130px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:32px;max-width:1300px}
.event h1{font-size:150px}
.event .txt{font-size:42px;line-height:1.3;color:#ddd;margin:0}
.event .covers3{position:absolute;right:120px;top:50%;transform:translateY(-50%);display:flex;gap:20px}
.event .covers3 img{width:300px;height:450px;object-fit:cover;display:block}

/* join */
.join{display:grid;grid-template-columns:1fr 540px;align-items:center;padding:0 140px 0 130px;gap:90px}
.join .copy{display:flex;flex-direction:column;gap:32px}
.join h1{font-size:148px}
.perks{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.perks div{background:var(--panel);border-left:6px solid var(--red);padding:22px 26px}
.perks b{display:block;font-family:var(--head);font-weight:900;font-size:32px;text-transform:uppercase}
.perks span{display:block;font-size:24px;color:var(--mute);margin-top:8px}
.join .card{background:#fff;color:var(--ink);display:flex;flex-direction:column;align-items:center}
.join .card img{width:420px;height:420px;margin:50px 50px 26px;image-rendering:pixelated;display:block}
.join .card b{font-family:var(--head);font-weight:900;font-size:38px;text-transform:uppercase;text-align:center;padding:0 30px 26px;line-height:1.05}
.join .card .btn{width:100%;justify-content:center;font-size:23px}

/* trailer (hosted version only) */
.trailer{background:#000}
.trailer #yt{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%}
.trailer .card{position:absolute;top:0;right:0;bottom:0;left:0;z-index:3;background:var(--ink);display:flex;flex-direction:column;justify-content:center;gap:28px;padding:0 140px;animation:cardOut .5s ease forwards 3.4s}
.trailer .card h1{font-size:160px}
.trailer .card p.when{font-weight:700;font-size:38px;letter-spacing:.12em;text-transform:uppercase;color:#ccc;margin:0}
@keyframes cardOut{to{opacity:0;visibility:hidden}}
.trailer .tie{position:absolute;left:56px;bottom:56px;z-index:2;display:flex;background:#0B0B0C;opacity:0;animation:fade .6s ease forwards 14s}
.trailer .tie img{height:150px;width:100px;object-fit:cover;display:block}
.trailer .tie div{padding:18px 28px;display:flex;flex-direction:column;justify-content:center;gap:8px}
.trailer .tie b{font-family:var(--head);font-weight:900;font-size:34px;text-transform:uppercase}
.trailer .tie span{font-weight:700;font-size:21px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}

@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
/* ---- v6 scenes ---- */
.src{font-weight:700;font-size:20px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);line-height:1.5;text-align:right}
.mk,.sold,.vel,.tl,.eras,.artists{padding:52px 110px 0}
.mk header,.sold header,.vel header,.tl header,.eras header,.artists header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:28px;padding-right:150px}
.mk h1,.sold h1,.vel h1,.tl h1,.eras h1,.artists h1{font-size:96px}
.mrow{display:grid;grid-template-columns:96px 92px minmax(0,1fr) 430px;align-items:center;gap:26px;background:var(--panel);height:142px;margin-bottom:10px;padding-right:28px;border-left:6px solid var(--line)}
.mrow.top{border-left-color:var(--red)}
.mrow .n{font-family:var(--head);font-weight:900;font-size:60px;text-align:center}
.mrow .c{width:88px;height:132px;object-fit:cover;display:block}
.mrow .c.blank{background:var(--panel2);display:flex;align-items:center;justify-content:center;font-family:var(--head);font-weight:900;font-size:46px;color:#3A3A40}
.mrow b{display:block;font-family:var(--head);font-weight:800;font-size:36px;text-transform:uppercase;line-height:1.02;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .w{display:block;font-size:25px;color:#cfcfd4;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .w i{font-style:normal;color:var(--mute);font-weight:700;font-size:19px;letter-spacing:.1em;text-transform:uppercase;margin-right:12px}
.mrow .ms{text-align:right}
.mrow .ms b{font-size:30px;white-space:normal}

.one figcaption b{display:block;font-family:var(--head);font-weight:800;font-size:26px;text-transform:uppercase;color:#cfcfd4;line-height:1.1}
.one figcaption span{display:flex;align-items:baseline;gap:16px;font-family:var(--head);font-weight:900;font-size:54px;margin-top:6px}
.one figcaption i{font-style:normal;font-family:var(--body);font-weight:700;font-size:20px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.chain figure img{filter:drop-shadow(0 30px 60px rgba(0,0,0,.6))}
.sign,.cgcss,.dwj{display:grid;grid-template-columns:minmax(0,1fr) 640px;gap:80px;align-items:center;padding:0 150px 0 130px}
.sign .copy,.cgcss .copy,.dwj .copy{display:flex;flex-direction:column;gap:30px}
.sign h1{font-size:132px}.cgcss h1{font-size:120px}.dwj h1{font-size:104px}
.cd{display:flex;align-items:flex-end;gap:14px}
.cd p{margin:0 18px 16px 0;font-weight:700;font-size:24px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);width:150px;line-height:1.2}
.cd div{background:rgba(255,255,255,.06);border-top:6px solid var(--red);width:170px;padding:14px 0 12px;text-align:center}
.cd b{display:block;font-family:var(--head);font-weight:900;font-size:110px;line-height:1;font-variant-numeric:tabular-nums}
.cd s{text-decoration:none;display:block;font-weight:700;font-size:18px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin-top:6px}
.sign .facts{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:980px}
.sign .facts div{background:rgba(255,255,255,.06);padding:20px 24px;display:grid;grid-template-columns:22px 1fr;column-gap:16px;row-gap:6px;align-items:center}
.sign .facts i{width:22px;height:22px;background:var(--red);grid-row:1/3}.sign .facts i.y{background:#F5C518}
.sign .facts b{font-family:var(--head);font-weight:900;font-size:30px;text-transform:uppercase;line-height:1}
.sign .facts span{font-size:24px;color:#cfcfd4}
.steps3{display:flex;flex-direction:column;gap:14px;max-width:920px}
.steps3 div{display:grid;grid-template-columns:76px 1fr;column-gap:24px;row-gap:4px;background:rgba(255,255,255,.06);padding:20px 24px;align-items:center}
.steps3 i{grid-row:1/3;width:76px;height:76px;background:#F5C518;color:#121212;font-style:normal;font-family:var(--head);font-weight:900;font-size:46px;display:flex;align-items:center;justify-content:center}
.steps3 b{font-family:var(--head);font-weight:900;font-size:36px;text-transform:uppercase;line-height:1}
.steps3 span{font-size:26px;color:#ddd;line-height:1.3}
.cgcss .H em{color:#F5C518}
.small{font-size:24px;color:var(--mute);margin:0}
.dwj .pts div{font-size:30px;background:rgba(255,255,255,.06)}
.dwj .pts b{margin-right:10px}
.monkw{padding:46px 110px 0}
.monkw header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:22px;padding-right:150px;gap:30px}
.monkw h1{font-size:92px}
.monkw .g6 .cv img{height:440px}
.app{display:grid;grid-template-columns:minmax(0,1fr) 640px;gap:90px;align-items:center;padding:0 190px 0 130px}
.app .copy{display:flex;flex-direction:column;gap:30px}.app h1{font-size:108px}
.app .pts div{font-size:30px}
.inc .hint,.monkw .hint{font-size:24px}
.dwj .pts,.app .pts{display:flex;flex-direction:column;gap:12px;max-width:900px}
.dwj .pts div,.app .pts div{background:rgba(255,255,255,.07);border-left:6px solid var(--red);padding:18px 24px;font-size:29px;line-height:1.25;font-weight:500;color:#e6e6ea}
.app .pts div{background:var(--panel)}
.dwj .pts b,.app .pts b{display:block;font-family:var(--head);font-weight:900;text-transform:uppercase;font-size:24px;letter-spacing:.04em;color:#fff;margin-bottom:4px}
.one figcaption span{white-space:nowrap;flex-wrap:wrap}

/* ===== v10 alignment pass ===== */
.eye{white-space:nowrap}
.sign h1{font-size:124px}
.join h1{font-size:118px}
.run .g6 .cv img{height:236px}
.blow .g6 .cv img{height:470px}
.tn h3{min-height:120px}
.tn .k{min-height:176px}
.feat .g6 .cv img{height:600px}
.feat .g6{margin-top:20px}
.sign .facts div{align-items:start}
.sign .facts i{margin-top:4px}
.chain{grid-template-columns:minmax(0,1fr) 860px}
.feat{display:flex;flex-direction:column}
.feat header{flex:none}
.feat .g6{flex:1;align-content:center;margin:0 0 70px}
.ic b{font-size:22px}
#tk{align-items:center;gap:12px;padding:0 26px;background:#F5C518;color:#121212;font-weight:900;font-size:22px;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
#tk b{font-family:var(--head);font-size:40px;letter-spacing:0}
.serve{display:flex;align-items:baseline;gap:22px}
.serve span{font-weight:700;font-size:26px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.serve b{font-family:var(--head);font-weight:900;font-size:120px;line-height:.9;color:#F5C518}
/* ===== v11: TV-safe backgrounds (Samsung browser can't blur), new branding ===== */
.amb{display:none!important}
.hero,.story,.chain,.sign,.cgcss,.dwj,.book{background:radial-gradient(ellipse at 78% 45%,#2B1416 0%,#171213 45%,var(--ink) 75%)}
.cgcss{background:radial-gradient(ellipse at 78% 45%,#2A2410 0%,#16140F 45%,var(--ink) 75%)}
.lab{width:300px}
.lab img{height:auto;width:250px}
#bug img{width:104px;height:auto}
.open .logo{width:1100px}
#bar .lab{width:320px;flex:none;padding:0 26px;box-sizing:border-box}
#bar .lab img{height:auto;width:100%;max-width:268px}
.trailer .card{animation:none!important;transition:opacity .7s ease}
.trailer.rolling .card{opacity:0;pointer-events:none}
.trailer .card::after{content:"";display:block;height:6px;width:420px;background:linear-gradient(90deg,var(--red) 0 30%,rgba(255,255,255,.12) 30%);background-size:300% 100%;animation:trLoad 1.6s linear infinite}
@keyframes trLoad{from{background-position:100% 0}to{background-position:0 0}}
.trailer .tie{opacity:0;transition:opacity .6s ease .6s}.trailer.rolling .tie{opacity:1}

const chip=(url,big,small)=>{const u=qrURL(url);return u?`<div class="qrc"><img src="${u}" alt=""><div><b>${big}</b><span>${small}</span></div></div>`:"";};
const amb=u=>u?`<div class="amb" style="background-image:url('${img(u,240)}')"></div>`:"";

function trVol(){const p=CURPL;if(!p)return;try{if(TVOL>0){p.unMute();p.setVolume(TVOL);}else p.mute();}catch(x){}}
function SOUNDWAIT(){return !GEST&&((Radio.on&&Radio.locked)||(CURPL&&TVOL>0&&(()=>{try{return CURPL.isMuted();}catch(x){return false;}})()));}
function soundUnlock(){GEST=true;trVol();}

function hms(ms){ms=Math.max(0,ms);const s=ms/1000|0;return [s/3600|0,s%3600/60|0,s%60].map(v=>String(v).padStart(2,"0"));}

const norm=n=>n.filter(p=>p.availableForSale!==false&&okImg(p.featuredImage&&p.featuredImage.url)).map(p=>({title:p.title.replace(/\s+/g," ").trim(),handle:p.handle,img:p.featuredImage.url,price:+p.priceRange.minVariantPrice.amount}));

/* hosted mode: the ranked lists come from the daily update (real sales data); every 30 minutes the TV double-checks stock on the site and drops anything that just sold out */
async function loadLive(){try{
  const lists=["hot","keys","blow","foc","inc","trades"];const H=new Set();lists.forEach(k=>(FEED[k]||[]).forEach(p=>p.handle&&H.add(p.handle)));(FEED.run&&FEED.run.items||[]).forEach(p=>p.handle&&H.add(p.handle));if(FEED.chain)[...FEED.chain.monk,...FEED.chain.covers].forEach(p=>p.handle&&H.add(p.handle));
  const hs=[...H];const avail={};
  for(let i=0;i<hs.length;i+=40){const part=hs.slice(i,i+40);const q=await sf(`{${part.map((h,j)=>`p${j}:product(handle:${J(h)}){handle availableForSale priceRange{minVariantPrice{amount}}}`).join(" ")}}`);Object.values(q).forEach(p=>{if(p)avail[p.handle]={a:p.availableForSale,p:+p.priceRange.minVariantPrice.amount};});}
  const keep=p=>!p.handle||!avail[p.handle]||avail[p.handle].a;const fix=p=>Object.assign({},p,avail[p.handle]?{price:avail[p.handle].p}:{});
  const upd={};lists.forEach(k=>{if(FEED[k]){const L=FEED[k].filter(keep).map(fix);if(k==="inc"||k==="trades"||L.length>=(k==="hot"?8:3))upd[k]=L;}});
  if(FEED.chain){const c=FEED.chain;upd.chain=Object.assign({},c,{monk:c.monk.filter(keep).map(fix),covers:c.covers.filter(keep).map(fix)});}
  if(FEED.run&&FEED.run.items){const it=FEED.run.items.filter(keep).map(fix);if(it.length>=6)upd.run=Object.assign({},FEED.run,{items:it});}
  FEED=Object.assign({},FEED,upd);warm();buildTicker();
}catch(e){console.warn("stock check unavailable",e);}}
async function findBooks(kw,n){const local=[...FEED.hot,...FEED.keys].filter(p=>p.title.toLowerCase().includes(kw.toLowerCase()));if(local.length>=n)return local.slice(0,n);

  function paint(box,f){if(!box)return;const old=PVS.get(box);if(old){try{old._cleanup&&old._cleanup();}catch(x){}}box.querySelectorAll(".pvi").forEach(e=>e.remove());let sc=null;try{sc=f();}catch(x){}if(!sc)return;const w=document.createElement("div");w.className="pvi";w.appendChild(sc.el);box.appendChild(w);PVS.set(box,sc.el);const fitb=()=>{const cw=box.clientWidth;if(!cw){requestAnimationFrame(fitb);return;}w.style.transform="scale("+(cw/1920)+")";};fitb();box._fit=fitb;}
  addEventListener("resize",()=>PVS.forEach((el,box)=>box._fit&&box._fit()));
  const io="IntersectionObserver" in window?new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting){const b=en.target;io.unobserve(b);const k=b.dataset.pv;if(PV[k])paint(b,PV[k]);}}),{rootMargin:"200px"}):null;
  const lazy=root=>root.querySelectorAll("[data-pv]").forEach(b=>{if(b._seen)return;b._seen=1;if(io)io.observe(b);else if(PV[b.dataset.pv])paint(b,PV[b.dataset.pv]);});
  const setTab=t=>{W.querySelectorAll("section.tab").forEach(s=>s.classList.toggle("cur",s.id==="t-"+t));W.querySelectorAll("nav button").forEach(b=>b.classList.toggle("cur",b.dataset.tab===t));lazy(W.querySelector("#t-"+t));PVS.forEach((el,box)=>box._fit&&box._fit());scrollTo(0,0);};
  const mark=()=>{W.querySelectorAll("[data-hold]").forEach(b=>b.classList.toggle("on",+b.dataset.hold===HOLD));W.querySelectorAll("#speed button").forEach(b=>b.classList.toggle("on",+b.dataset.s===S0.speed));W.querySelectorAll("#mode button").forEach(b=>b.classList.toggle("on",b.dataset.m===S0.mode));
    const sm=S0.sig&&S0.sig.mode||"auto";W.querySelectorAll("#sig button").forEach(b=>{b.classList.toggle("on",b.dataset.sig===sm&&sm!=="break");b.classList.toggle("y",b.dataset.sig===sm&&sm==="break");});W.querySelector("#back").value=S0.sig&&S0.sig.back||"";
    W.querySelector("#tn").textContent=S0.serve>0?"#"+S0.serve:"Off";
    W.querySelector("#stations").innerHTML=(S0.stations||[]).map((x,i)=>`<button data-st="${i}" class="${S0.radio.on&&S0.radio.url===x.url?"on":""}">${esc(x.name)}<small data-del="${i}" style="display:block;font-weight:400;color:#B5B5BC;font-size:11px;margin-top:4px">Remove</small></button>`).join("");
    const r=W.querySelector("#ron");r.textContent=S0.radio.on?`Radio on · ${S0.radio.name}`:"Radio off";r.classList.toggle("on",S0.radio.on);W.querySelector("#vol").value=S0.radio.vol;W.querySelector("#bn").value=S0.banner||"";
    W.querySelector("#tvol").value=S0.tvol;W.querySelector("#tvl").textContent=S0.tvol>0?"Trailer volume "+S0.tvol+"%":"Trailers play muted";W.querySelector("#tmute").textContent=S0.tvol>0?"Mute trailers":"Unmute trailers";
    W.querySelector("#picks").innerHTML=(S0.feat||[]).length?S0.feat.map((p,i)=>`<div><img src="${img(p.img,200)}" alt=""><button data-unpick="${i}">Remove</button></div>`).join(""):`<p class="note" style="margin:0">None yet. Search a book and tap Pick.</p>`;};
  mark();
  fetch(RELAY+"/json?poll=1&since=48h").then(x=>x.text()).then(t=>{let last=null;t.trim().split("\n").forEach(l=>{try{const m=JSON.parse(JSON.parse(l).message);if(m.cmd==="state")last=m;}catch(x){}});if(last){["mode","speed","banner","stations","radio","sig","feat","serve","tvol"].forEach(k=>{if(last[k]!=null)S0[k]=last[k];});SIG=S0.sig||SIG;FEAT=S0.feat||[];SERVE=S0.serve||0;mark();}}).catch(()=>{});
  const serve=n=>{S0.serve=Math.max(0,n);SERVE=S0.serve;save();mark();tip(S0.serve?"Now signing #"+S0.serve:"Ticket numbers off");};
  W.addEventListener("click",e=>{const b=e.target.closest("button,[data-p]");if(!b)return;
    if(b.dataset.tab){setTab(b.dataset.tab);return;}
    if(b.id==="ping"||b.id==="ping2"){post({cmd:"ping",at:Date.now()});tip("Asking the TV…");}
    else if(b.dataset.hold){HOLD=+b.dataset.hold;try{localStorage.setItem("cctvHold",HOLD);}catch(x){}mark();tip("Pushed screens stay up "+b.textContent);}
    else if(b.dataset.c){if(b.id==="pp"){const p=b.dataset.c==="pause";cmd({cmd:p?"pause":"play"},p?"Paused":"Playing");b.dataset.c=p?"play":"pause";b.textContent=p?"▶ Play":"❚❚ Pause";return;}cmd({cmd:b.dataset.c},{prev:"Back one",next:"Back to the channel",reload:"Reloading the TV"}[b.dataset.c]);}
    else if(b.dataset.sig){S0.sig={mode:b.dataset.sig,back:W.querySelector("#back").value};SIG=S0.sig;save({sigPush:b.dataset.sig!=="done",ack:1});mark();tip(b.querySelector("span").textContent+" is on the TV");}
    else if(b.id==="tp")serve((S0.serve||0)+1);else if(b.id==="tm")serve((S0.serve||0)-1);else if(b.id==="tp5")serve((S0.serve||0)+5);else if(b.id==="t0")serve(0);
    else if(b.id==="tset"){const i=document.createElement("input");i.type="number";i.inputMode="numeric";i.placeholder="Ticket number";i.style.marginTop="10px";b.parentNode.after(i);i.focus();i.addEventListener("change",()=>{serve(+i.value||0);i.remove();});}
    else if(b.dataset.s){S0.speed=+b.dataset.s;save();mark();tip("Speed set");}
    else if(b.dataset.m){S0.mode=b.dataset.m;save();mark();tip(MODES[S0.mode]);}
    else if(b.id==="tmute"){S0.tvol=S0.tvol>0?0:70;save();mark();tip(S0.tvol?"Trailer sound on":"Trailers muted");}
    else if(b.dataset.st){if(e.target.dataset.del!=null){S0.stations.splice(+e.target.dataset.del,1);save();mark();tip("Station removed");return;}const x=S0.stations[+b.dataset.st];S0.radio=Object.assign(S0.radio,{on:true,name:x.name,url:x.url});save();mark();tip("Playing "+x.name);}
    else if(b.id==="ron"){if(!S0.radio.url){tip("Add a station first");return;}S0.radio.on=!S0.radio.on;save();mark();tip(S0.radio.on?"Radio on":"Radio off");}
    else if(b.id==="cgo"){const u=W.querySelector("#curl").value.trim(),n=W.querySelector("#sname").value.trim()||"Station "+((S0.stations||[]).length+1);if(!/^https:\/\//.test(u)){tip("The link needs to start with https://");return;}S0.stations=(S0.stations||[]).concat([{name:n,url:u}]);S0.radio=Object.assign(S0.radio,{on:true,url:u,name:n});save();mark();W.querySelector("#curl").value="";W.querySelector("#sname").value="";tip("Playing "+n);}
    else if(b.dataset.p){const [k,a]=b.dataset.p.split(":");show(k,a!=null?+a:undefined);}
    else if(b.dataset.pre){const p=PRE[+b.dataset.pre];show("msg",{eye:p[0],h:p[1],sub:p[2]});}
    else if(b.id==="msend"){const m={eye:W.querySelector("#me").value.trim(),h:W.querySelector("#mh").value.trim(),sub:W.querySelector("#ms").value.trim()};if(!m.h){tip("Add a headline");return;}show("msg",m);}
    else if(b.id==="bset"){S0.banner=W.querySelector("#bn").value.trim();save();tip("Banner running");}
    else if(b.id==="bclr"){S0.banner="";save();mark();tip("Banner cleared");}
    else if(b.dataset.book){const p=RES[+b.dataset.book];show("book",{title:p.title,img:p.img,price:p.price,handle:p.handle,avail:p.avail});}
    else if(b.dataset.pick){const p=RES[+b.dataset.pick];S0.feat=(S0.feat||[]).filter(x=>x.handle!==p.handle).concat([{title:p.title,img:p.img,price:p.price,handle:p.handle}]).slice(-6);FEAT=S0.feat;save();mark();tip("Added to staff picks");}
    else if(b.dataset.unpick){S0.feat.splice(+b.dataset.unpick,1);FEAT=S0.feat;save();mark();tip("Removed");}});
  W.querySelector("#back").addEventListener("change",()=>{if(S0.sig&&S0.sig.mode==="break"){S0.sig.back=W.querySelector("#back").value;save({sigPush:true});tip("Back time updated");}});
  W.querySelector("#vol").addEventListener("change",e=>{S0.radio.vol=+e.target.value;save();});
  W.querySelector("#tvol").addEventListener("change",e=>{S0.tvol=+e.target.value;save();mark();});
  let RES=[],qt;W.querySelector("#q").addEventListener("input",e=>{clearTimeout(qt);const v=e.target.value.trim();if(v.length<3)return;qt=setTimeout(()=>search(v),350);});
  async function search(v){const box=W.querySelector("#res");box.innerHTML=`<p class="note">Searching…</p>`;try{const d=await sf(`{products(first:18,query:${J(v)},sortKey:RELEVANCE){nodes{title handle availableForSale featuredImage{url} priceRange{minVariantPrice{amount}}}}}`);
    RES=d.products.nodes.filter(p=>p.featuredImage&&okImg(p.featuredImage.url)).map(p=>({title:p.title.replace(/\s+/g," ").trim(),handle:p.handle,img:p.featuredImage.url,price:+p.priceRange.minVariantPrice.amount,avail:p.availableForSale}));
    RES.sort((a,b)=>(b.avail-a.avail));
    box.innerHTML=RES.length?RES.map((p,i)=>`<div class="bk"><img src="${img(p.img,300)}" alt="" loading="lazy"><div>${p.avail?"":`<span class="so">Sold out</span><br>`}${esc(shortT(p.title))}<b>${money(p.price)}</b></div><div class="act"><button data-book="${i}" class="on">Show</button><button data-pick="${i}"${p.avail?"":" disabled"}>Pick</button></div></div>`).join(""):`<p class="note">Nothing found. Try fewer words.</p>`;}catch(x){box.innerHTML=`<p class="note">Search couldn't reach the site. Check the internet.</p>`;}}
  const SIGN={before:"countdown to noon",live:"signing live",break:"Jeff on break",last:"last call",done:"signing over",off:""};let lastNow="";
  try{const es=new EventSource(RELAY+"-ack/sse");es.onmessage=e=>{try{const d=JSON.parse(e.data);if(d.event!=="message")return;const m=JSON.parse(d.message);if(m.cmd!=="ack")return;
    W.querySelector("#dot").classList.add("on");W.querySelector("#cst").textContent="TV on";
    W.querySelector("#tvnow").textContent=(NAMES[m.now]||m.now||"Starting up")+(m.paused?" · paused":"");
    W.querySelector("#tvsub").textContent=[MODES[m.mode],SIGN[m.sig]?"Signing: "+SIGN[m.sig]:"",m.serve?"Ticket #"+m.serve:"",m.locked?"Sound is blocked until someone presses OK on the TV remote once":(m.radio?"Radio: "+m.radio:"")].filter(Boolean).join(" · ");
    const old=m.cv&&m.cv<76;const wn=W.querySelector("#warn");wn.style.display=old?"block":"none";if(old)wn.textContent=`This TV's browser is old (version ${m.cv}). If slides look squished, plug in the Fire TV stick and use its Silk browser.`;
    if(m.now&&m.now!==lastNow){lastNow=m.now;const lp=W.querySelector("#livepv");if(PV[m.now])paint(lp,PV[m.now]);else{PVS.delete(lp);lp.querySelectorAll(".pvi").forEach(x=>x.remove());}}}catch(x){}};}catch(x){}
  post({cmd:"ping",at:Date.now()});
  const pin=document.createElement("div");pin.id="pin";pin.innerHTML=`<div><h1>CaptCan TV Remote</h1><p style="color:#A9A9B0">Enter the staff PIN</p><input id="pinv" type="password" inputmode="numeric" autocomplete="off" style="font-size:28px;text-align:center;background:#16161A;color:#fff;border:1px solid #33333A;border-radius:12px;padding:14px;width:100%;box-sizing:border-box"></div>`;
  let ok=false;try{ok=localStorage.getItem("cctvPin")==="466466";}catch(x){}
  if(!ok){document.body.appendChild(pin);const i=pin.querySelector("input");i.focus();i.addEventListener("input",()=>{if(i.value==="466466"){try{localStorage.setItem("cctvPin","466466");}catch(x){}pin.remove();}});}
}

if(IS_REMOTE){remoteUI();}else{warm();
(document.fonts&&document.fonts.ready?Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,3000))]):Promise.resolve()).then(()=>{buildTicker();next();});
if(!ART){loadLive();setInterval(loadLive,30*60*1000);listen();restore()}}
/* Claude-link mode: live copies of the store feed, market data and image map come from the shared store, refreshed every morning */
if(ART)(async()=>{try{if(!window.claude)return;const db=await claude.use("db");if(!db)return;
  db.doc("tv/assetmap").onSnapshot(s=>{if(s.exists){const d=s.data();if(d&&d.map)AMAP=Object.assign({},AMAP,d.map);}},()=>{});
  db.doc("tv/feed").onSnapshot(s=>{if(s.exists){const d=s.data();if(d&&d.hot&&d.hot.length>=8){FEED=Object.assign({},FEED,d);warm();buildTicker();}}},()=>{});
  db.doc("tv/market").onSnapshot(s=>{if(s.exists){const d=s.data();if(d&&d.hot10&&d.hot10.length>=10){MARKET=Object.assign({},MARKET,d);buildTicker();}}},()=>{});
}catch(e){}})();
setInterval(()=>{const d=now();if(d.getHours()===4&&d.getMinutes()<1)location.reload();},45000);

</script>
